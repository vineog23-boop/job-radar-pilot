name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: job-radar-pilot/requirements.lock.txt

      - name: Clonar Scrapling fixado em v0.4.15
        run: git clone --depth 1 --branch v0.4.15 https://github.com/D4Vinci/Scrapling vendor/Scrapling

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "vendor/Scrapling[fetchers]" -e "job-radar-pilot[test]"
          python -m playwright install --with-deps chromium

      - name: Rodar testes (sem rede para os portais)
        env:
          PYTHONPATH: job-radar-pilot/src
        run: python -m pytest job-radar-pilot/tests -q
