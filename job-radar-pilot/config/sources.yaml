    selectors: {card: "a.cd-job", title: ".cd-job-title::all-text", url: "::attr(href)", company: ".cd-job-company::all-text", location: ".cd-job-meta > span:nth-of-type(2)::all-text", summary: ".cd-guide-desc::all-text", next: "a[rel='next']::attr(href)"}
  - code: ciee
