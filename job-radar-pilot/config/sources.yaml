  - code: quickin
    kind: generic
    start_url: https://jobs.quickin.io/onzze/jobs
    enabled: true
    max_pages: 1
    min_interval_seconds: 3
    requires_auth: false
    adaptive: true
    default_country: BR
    tech_focus: true
    fixed_queries: true
    single_page: true
    query_path: "/{query}/jobs"
    queries: [onzze, sinqia, cadmus, topmind]
    selectors: {card: "table tr", title: "th a::all-text", url: "th a::attr(href)", location: "td span:first-child::all-text", summary: "::all-text"}
