sources:
  - code: gupy-api
    kind: json
    start_url: https://employability-portal.gupy.io/api/v1/jobs?limit=100
    enabled: true
    max_pages: 5
    min_interval_seconds: 1
    requires_auth: false
    adaptive: false
    default_country: BR
    tech_focus: true
    query_param: jobName
    queries: [java, spring boot, backend, desenvolvedor de software, engenheiro de software, estagio desenvolvimento]
    api:
      items: data
      page_param: offset
      page_mode: offset
      page_size: 100
      size_param: limit
      workplace_param: workplaceType
      state_param: state
      strip_levels: true
      fields:
        id: id
        title: name
        company: careerPageName
        city: city
        state: state
        country: country
        published: publishedDate
        deadline: applicationDeadline
        employment_type: type
        description: description
        workplace: workplaceType
        remote_flag: isRemoteWork
        url: jobUrl
        skills: skills
  - code: primeiravagatech
    kind: json
    start_url: https://primeiravagatech-production.up.railway.app/minhavagatech/vagas/paginated
    enabled: true
    max_pages: 60
    min_interval_seconds: 2
    requires_auth: false
    adaptive: false
    default_country: BR
    tech_focus: true
    api:
      items: content
      page_param: page
      page_mode: page0
      page_size: 15
      fields:
        id: id
        title: title
        company: companyName
        city: city
        state: state
        published: datePosted
        employment_type: employmentTypeRaw
        url_template: "https://www.primeiravagatech.com.br/vaga/{slug}"
  - code: empregostec
    kind: rss
    start_url: https://www.empregostec.com.br/feed/
    enabled: true
    max_pages: 1
    min_interval_seconds: 2
    requires_auth: false
    adaptive: false
    default_country: BR
    tech_focus: true
  - code: gupy
    kind: gupy
    start_url: https://portal.gupy.io/job-search/term%3Ddesenvolvedor%20junior
    enabled: false
    max_pages: 3
    min_interval_seconds: 2
    requires_auth: false
    adaptive: true
    default_country: BR
    tech_focus: true
    queries: [desenvolvedor java junior, backend junior, estagio desenvolvimento, estagio tecnologia, engenheiro de software junior]
  - code: indeed
    kind: indeed
    start_url: https://br.indeed.com/jobs?q=java+junior
    enabled: true
    max_pages: 1
    min_interval_seconds: 3
    requires_auth: false
    adaptive: true
    default_country: BR
    tech_focus: true
    queries: [Java junior, estagio desenvolvimento, backend junior, spring boot junior, estagio java, desenvolvedor software junior]
  - code: estagiotrainee
    kind: generic
    start_url: https://www.estagiotrainee.com/vagas-programas-estagio
    enabled: true
    max_pages: 1
    min_interval_seconds: 2
    requires_auth: false
    adaptive: true
    default_country: BR
    selectors: {card: ".gallery-item-container", title: "a.O16KGI[href*='/post/']::all-text", url: "a.O16KGI[href*='/post/']::attr(href)", published: "span.post-metadata__date::all-text"}
  - code: eureca
    kind: dynamic
    start_url: https://app.eureca.me/oportunidades
    enabled: true
    max_pages: 1
    min_interval_seconds: 3
    requires_auth: false
    adaptive: true
    default_country: BR
    single_page: true
    browser: {scroll_to_load: true}
    selectors: {card: "[data-testid^='opportunities-list-card-']:not([data-testid$='-cta'])", title: "p.text-base::all-text", url: "a[href^='/vagas/']::attr(href)", company: "div.flex.items-center span::all-text", location: "div.flex.flex-wrap.items-center > div:nth-of-type(3)::all-text", summary: "::all-text"}
  - code: programathor
    kind: generic
    start_url: https://programathor.com.br/jobs-java
    enabled: true
    max_pages: 20
    min_interval_seconds: 2
    requires_auth: false
    adaptive: true
    default_country: BR
    tech_focus: true
    selectors: {card: ".cell-list:not(.opacity-60p) > a[href^='/jobs/']", title: ".cell-list-content h3::all-text", url: "::attr(href)", company: ".cell-list-content-icon > span:nth-of-type(1)::all-text", location: ".cell-list-content-icon > span:nth-of-type(2)::all-text", summary: "::all-text", next: "ul.pagination li:nth-last-child(2) a.page-link::attr(href)"}
  - code: casado-dev
