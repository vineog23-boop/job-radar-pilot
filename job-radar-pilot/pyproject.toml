[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "job-radar-pilot"
version = "0.1.0"
description = "Coletor independente de vagas usando Scrapling"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "ruff>=0.6"]

[project.scripts]
job-radar = "job_radar.cli:main"
job-radar-ui = "job_radar.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_radar = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["production_filters: testa os filtros iniciais sem o seed legado de navegador"]
filterwarnings = [
  "ignore:The 'strip_cdata' option of HTMLParser\\(\\) has never done anything.*:DeprecationWarning:lxml.html",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["output", "debug.log"]

[tool.ruff.lint]
# Só erros reais (sintaxe, nomes não definidos, imports/variáveis sem uso).
select = ["E9", "F"]
